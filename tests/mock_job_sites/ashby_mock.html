<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ashby Application Mock</title>
</head>
<body>
  <div id="ashby-app-root">
    <h1>Ashby Application Form</h1>
    <form id="ashby-application-form">
      <div class="field">
        <label for="ashby-name">Full Name</label>
        <input type="text" id="ashby-name" name="name" />
      </div>
      <div class="field">
        <label for="ashby-email">Email Address</label>
        <input type="email" id="ashby-email" name="email" />
      </div>
      <div class="field">
        <label for="ashby-phone">Phone</label>
        <input type="tel" id="ashby-phone" name="phone" />
      </div>
      <div class="field">
        <label for="ashby-linkedin">LinkedIn Profile</label>
        <input type="url" id="ashby-linkedin" name="linkedinUrl" />
      </div>
      <div class="field">
        <label for="ashby-resume">Resume</label>
        <input type="file" id="ashby-resume" name="resume" />
      </div>
      <button type="submit" id="ashby-submit-btn">Submit Application</button>
    </form>
  </div>
</body>
</html>
