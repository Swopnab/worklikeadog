name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium --only-shell --with-deps
      - name: Install PDF compiler
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Run application tests
        run: python -m pytest -q
      - name: Check JavaScript
        run: |
          node --check frontend/js/app.js
          node --check site/demo.js
