<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workday Enterprise Application Mock</title>
</head>
<body>
  <div data-automation-id="workday-application-page">
    <h2>My Information</h2>
    <form id="workday-form">
      <div class="form-group">
        <label for="fname">First Name</label>
        <input type="text" id="fname" data-automation-id="legalNameSection_firstName" name="legalNameSection_firstName" />
      </div>
      <div class="form-group">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" data-automation-id="legalNameSection_lastName" name="legalNameSection_lastName" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" data-automation-id="email" name="email" />
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" data-automation-id="phone-number" name="phone-number" />
      </div>
      <div class="form-group">
        <label for="resume">Resume / CV</label>
        <div data-automation-id="file-upload-drop-zone">
          <input type="file" id="resume" />
        </div>
      </div>
      <div class="navigation-buttons">
        <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
      </div>
    </form>
  </div>
</body>
</html>
